name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        working-directory: Packages/PlumeKit
        run: swift test
      - name: Build for the iPhone simulator
        run: |
          brew install xcodegen
          scripts/generate.sh
          xcodebuild -project Plume.xcodeproj -scheme PlumeiOS \
            -destination 'generic/platform=iOS Simulator' build -quiet
