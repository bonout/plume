name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Package, iPhone and Mac builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner uses an older Xcode by default.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Package tests
        working-directory: Packages/PlumeKit
        run: swift test
      - run: brew install xcodegen && scripts/generate.sh
      - name: iPhone simulator build
        run: |
          set -o pipefail
          xcodebuild -project Plume.xcodeproj -scheme PlumeiOS \
            -destination 'generic/platform=iOS Simulator' build -quiet
      # Unsigned: a signed Mac build needs a team for its entitlements.
      - name: Mac build
        run: |
          set -o pipefail
          xcodebuild -project Plume.xcodeproj -scheme PlumeMac -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= \
            PLUME_MAC_APP_GROUP= build -quiet
