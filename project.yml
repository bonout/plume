# Xcode project, generated by XcodeGen (scripts/generate.sh); the .xcodeproj
# is never committed. Personal settings (team, bundle prefix) come from
# Config/Local.xcconfig, see Config/Base.xcconfig.
name: Plume
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  PlumeKit:
    path: Packages/PlumeKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targetTemplates:
  App:
    type: application
    sources:
      - path: App
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PlumeKit
        product: PlumeKit
      - package: PlumeKit
        product: PlumeUI
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Plume
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PlumeAppGroup: $(PLUME_APP_GROUP)
        # HTTPS everywhere, except servers on the local network (a server at
        # home reached by its .local name or IP address).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.productivity
        # Only HTTPS (exempt encryption): no export compliance question on
        # each TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # "Search in App" from Spotlight results.
        CoreSpotlightContinuation: true
        # Any file can be opened in Plume ("Open in…", drop on the Dock
        # icon): it is then uploaded to a folder the user picks.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLUME_BUNDLE_PREFIX)
        PRODUCT_NAME: Plume
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FileProviderExtension:
    type: app-extension
    sources:
      - path: FileProvider
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PlumeKit
        product: PlumeKit
      - sdk: FileProvider.framework
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Plume
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PlumeAppGroup: $(PLUME_APP_GROUP)
        # HTTPS everywhere, except servers on the local network (a server at
        # home reached by its .local name or IP address).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: $(PLUME_APP_GROUP)
          # In the item menus of Finder and the Files app (see
          # FileProviderExtension.performAction).
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: plume.copyLink
              NSExtensionFileProviderActionName: Copy Public Link
              NSExtensionFileProviderActionActivationRule: >-
                SUBQUERY ( fileproviderItems, $fileproviderItem,
                $fileproviderItem.itemIdentifier != "NSFileProviderRootContainerItemIdentifier" ).@count == 1
            - NSExtensionFileProviderActionIdentifier: plume.favorite
              NSExtensionFileProviderActionName: Add to Favorites
              NSExtensionFileProviderActionActivationRule: >-
                SUBQUERY ( fileproviderItems, $fileproviderItem,
                $fileproviderItem.userInfo.favorite == NO ).@count > 0
            - NSExtensionFileProviderActionIdentifier: plume.unfavorite
              NSExtensionFileProviderActionName: Remove from Favorites
              NSExtensionFileProviderActionActivationRule: >-
                SUBQUERY ( fileproviderItems, $fileproviderItem,
                $fileproviderItem.userInfo.favorite == YES ).@count > 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLUME_BUNDLE_PREFIX).fileprovider
        PRODUCT_NAME: PlumeFileProvider

  ShareExtension:
    type: app-extension
    sources:
      - path: ShareExtension
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PlumeKit
        product: PlumeKit
      - package: PlumeKit
        product: PlumeUI
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Plume
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PlumeAppGroup: $(PLUME_APP_GROUP)
        # HTTPS everywhere, except servers on the local network (a server at
        # home reached by its .local name or IP address).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Files, photos and videos, up to 100 at a time.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 100
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLUME_BUNDLE_PREFIX).share
        PRODUCT_NAME: PlumeShare

targets:
  PlumeMac:
    templates: [App]
    platform: macOS
    dependencies:
      - target: PlumeFileProviderMac
      - target: PlumeShareMac
    settings:
      base:
        PLUME_APP_GROUP: $(PLUME_MAC_APP_GROUP)
        CODE_SIGN_ENTITLEMENTS: Config/Mac.entitlements

  PlumeFileProviderMac:
    templates: [FileProviderExtension]
    platform: macOS
    settings:
      base:
        PLUME_APP_GROUP: $(PLUME_MAC_APP_GROUP)
        CODE_SIGN_ENTITLEMENTS: Config/MacExtension.entitlements

  PlumeShareMac:
    templates: [ShareExtension]
    platform: macOS
    settings:
      base:
        PLUME_APP_GROUP: $(PLUME_MAC_APP_GROUP)
        CODE_SIGN_ENTITLEMENTS: Config/MacExtension.entitlements

  PlumeiOS:
    templates: [App]
    platform: iOS
    dependencies:
      - target: PlumeFileProvideriOS
      - target: PlumeShareiOS
    info:
      path: Generated/PlumeiOS-Info.plist
      properties:
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen: {}
        # Changes from the server while Plume is closed (refresh), uploads
        # that go on after leaving the app (upload.*, iOS 26).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
          - $(PRODUCT_BUNDLE_IDENTIFIER).upload.*
    settings:
      base:
        PLUME_APP_GROUP: $(PLUME_IOS_APP_GROUP)
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  PlumeFileProvideriOS:
    templates: [FileProviderExtension]
    platform: iOS
    settings:
      base:
        PLUME_APP_GROUP: $(PLUME_IOS_APP_GROUP)
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: NO

  PlumeShareiOS:
    templates: [ShareExtension]
    platform: iOS
    settings:
      base:
        PLUME_APP_GROUP: $(PLUME_IOS_APP_GROUP)
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: NO
