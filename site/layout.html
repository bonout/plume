<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07080d">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<link rel="alternate" hreflang="x-default" href="{{alternate_en}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Plume">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{{og_locale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/icon-180.png">
{{preload}}
<style>{{css}}</style>
{{schema}}
{{redirect}}
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="{{home}}"><img src="/img/icon-64.png" alt="" width="28" height="28">Plume</a>
    <div class="links">
      <a href="{{iphone}}">{{w_iphone}}</a>
      <a href="{{mac}}">{{w_mac}}</a>
      <a href="{{compare}}">{{w_compare}}</a>
      <a href="{{faq}}">{{w_faq}}</a>
      <a href="https://github.com/bonout/plume">GitHub</a>
    </div>
    <details class="lang">
      <summary aria-label="{{w_language}}">{{lang_code}}</summary>
      <div class="menu">{{lang_menu}}</div>
    </details>
    <a class="button" href="{{download}}">{{w_download}}</a>
  </div>
</nav>

{{body}}

<footer>
  <div class="wrap">
    <a class="brand" href="{{home}}"><img src="/img/icon-64.png" alt="" width="28" height="28">Plume</a>
    <span>{{w_footer}}</span>
    <nav>
      <a href="{{iphone}}">{{w_iphone}}</a>
      <a href="{{mac}}">{{w_mac}}</a>
      <a href="{{compare}}">{{w_vs_official}}</a>
      <a href="{{faq}}">{{w_faq}}</a>
      <a href="{{privacy}}">{{w_privacy}}</a>
      <a href="https://github.com/bonout/plume">GitHub</a>
      <a href="{{support}}">{{w_support}}</a>
    </nav>
  </div>
</footer>

<script src="/site.js"></script>
</body>
</html>
